    body::before {
      content: ''; position: fixed; inset: 0;
      background-image:
        radial-gradient(1px 1px at  8% 12%, rgba(255,255,255,0.7) 0%, transparent 100%),
        radial-gradient(1px 1px at 22% 68%, rgba(255,255,255,0.5) 0%, transparent 100%),
        radial-gradient(1.5px 1.5px at 38%  8%, rgba(255,255,255,0.6) 0%, transparent 100%),
        radial-gradient(1px 1px at 51% 45%, rgba(255,255,255,0.4) 0%, transparent 100%),
        radial-gradient(1px 1px at 67% 82%, rgba(255,255,255,0.6) 0%, transparent 100%),
        radial-gradient(1px 1px at 75% 28%, rgba(255,255,255,0.3) 0%, transparent 100%),

        radial-gradient(1px 1px at 14% 88%, rgba(255,255,255,0.4) 0%, transparent 100%),
        radial-gradient(1px 1px at 44% 75%, rgba(255,255,255,0.3) 0%, transparent 100%),
        radial-gradient(1px 1px at 93% 15%, rgba(255,255,255,0.6) 0%, transparent 100%),
        radial-gradient(1px 1px at 30% 35%, rgba(255,255,255,0.4) 0%, transparent 100%),
        radial-gradient(1px 1px at 60% 22%, rgba(255,255,255,0.5) 0%, transparent 100%),
        radial-gradient(1.5px 1.5px at  5% 50%, rgba(255,255,255,0.5) 0%, transparent 100%),
        radial-gradient(1px 1px at 55% 95%, rgba(255,255,255,0.4) 0%, transparent 100%);
      pointer-events: none; z-index: 0;
    }
    #app { position: relative; z-index: 1; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 3rem 1.5rem; }
    .landing { text-align: center; max-width: 420px; }
    .landing .moon { display: block; font-size: 3.5rem; color: var(--gold); margin-bottom: 1.75rem; animation: breathe 4s ease-in-out infinite; }
    @keyframes breathe { 0%, 100% { opacity: 0.6; transform: scale(1); } 50% { opacity: 1; transform: scale(1.06); } }
    .landing h1 { font-family: 'Cinzel', serif; font-size: 2.6rem; font-weight: 400; color: var(--gold); letter-spacing: 0.12em; }
    .ornament { display: flex; align-items: center; gap: 1rem; margin: 1.5rem auto; width: fit-content; }
    .ornament-line { width: 60px; height: 1px; background: var(--gold-mid); }
    .ornament-dot { font-size: 0.6rem; color: var(--gold); }
    .landing p { font-size: 1.2rem; font-style: italic; color: var(--text-dim); line-height: 1.8; margin-bottom: 2.5rem; }
    .btn-connect { background: transparent; color: var(--gold); border: 1px solid var(--gold); padding: 0.9rem 2.2rem; font-family: 'Cinzel', serif; font-size: 0.8rem; letter-spacing: 0.2em; text-transform: uppercase; cursor: pointer; transition: background 0.3s, color 0.3s; }
    .btn-connect:hover { background: var(--gold); color: var(--bg); }
    .loading { text-align: center; }
    .loading .spinner { display: block; font-size: 2.5rem; color: var(--gold); margin-bottom: 1.5rem; animation: spin 5s linear infinite; }
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    .loading p { font-family: 'Cinzel', serif; font-size: 0.75rem; letter-spacing: 0.25em; text-transform: uppercase; color: var(--text-dim); }
    .reading { max-width: 860px; width: 100%; }
    .reading-header { text-align: center; margin-bottom: 3rem; }
    .reading-header h2 { font-family: 'Cinzel', serif; font-size: 1.6rem; font-weight: 400; color: var(--gold); letter-spacing: 0.1em; margin-bottom: 0.5rem; }
    .reading-header p { font-style: italic; color: var(--text-dim); font-size: 1.05rem; }
    .cards-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.75rem; margin-bottom: 1rem; }
    @media (max-width: 600px) { .cards-grid { grid-template-columns: 1fr; max-width: 260px; margin: 0 auto 1rem; } }
    .tarot-card { aspect-ratio: 500 / 860; position: relative; cursor: pointer; opacity: 0; transform: translateY(24px); transform-style: preserve-3d; transition: opacity 0.7s ease, transform 0.7s ease; }
    .tarot-card.revealed { opacity: 1; transform: translateY(0); }
    .card-inner { position: absolute; inset: 0; transform-style: preserve-3d; transition: transform 0.75s cubic-bezier(0.4, 0, 0.2, 1); }
    .card-inner.flipped { transform: rotateY(180deg); }
    .card-front, .card-back { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; }
    .card-front { background: var(--card-bg); border: 1px solid var(--gold-mid); display: flex; flex-direction: column; align-items: center; padding: 1.4rem 1.1rem 1.2rem; overflow-y: auto; }
    .card-front::before { content: ''; position: absolute; inset: 6px; border: 1px solid var(--gold-dim); pointer-events: none; }
    .card-front::after { content: '✦'; position: absolute; bottom: 10px; right: 10px; font-size: 0.5rem; color: var(--gold-dim); }
    .card-back { transform: rotateY(180deg); background: #000; border: 1px solid var(--gold-mid); overflow: hidden; }
    .card-back img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .card-back-placeholder { width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0.75rem; color: var(--gold-dim); }
    .card-back-placeholder span { font-size: 2rem; }
    .card-back-placeholder p { font-family: 'Cinzel', serif; font-size: 0.6rem; letter-spacing: 0.2em; text-transform: uppercase; }
    .card-position { font-family: 'Cinzel', serif; font-size: 0.55rem; letter-spacing: 0.3em; text-transform: uppercase; color: var(--text-dim); text-align: center; margin-bottom: 0.9rem; }
    .card-numeral { font-family: 'Cinzel', serif; font-size: 0.65rem; letter-spacing: 0.25em; color: var(--gold-dim); text-align: center; margin-bottom: 0.3rem; }
    .card-symbol { display: block; font-size: 2rem; text-align: center; color: var(--gold); margin: 0.3rem 0; }
    .card-name { font-family: 'Cinzel', serif; font-size: 0.85rem; font-weight: 600; color: var(--gold); text-align: center; letter-spacing: 0.05em; margin-bottom: 0.9rem; }
    .card-rule { width: 32px; height: 1px; background: var(--gold-mid); margin: 0 auto 0.9rem; }
    .card-reading { font-size: 0.85rem; line-height: 1.75; color: var(--text); font-style: italic; text-align: center; }

    .error-state { text-align: center; }

// ─── WORKAROUND 3: RELATED ARTISTS FALLBACK ──────────────
// For top artists not in the lookup, fetch their related artists
// and check those against the table. Only runs for top 5 unlisted artists
// to keep API calls manageable.
async function inferCardFromRelated(artist, token) {
  try {
    const res = await fetch(`https://api.spotify.com/v1/artists/${artist.id}/related-artists`, {
      headers: { Authorization: 'Bearer ' + token }
    });
    const data = await res.json();
    const related = data.artists || [];
    const scores = {};
    for (const rel of related.slice(0, 10)) {
      const card = ARTIST_CARDS[rel.name.toLowerCase()] || cardFromName(rel.name);
      if (card) scores[card] = (scores[card] || 0) + 1;
    }
    const top = Object.entries(scores).sort((a, b) => b[1] - a[1]);
    return top.length > 0 ? top[0][0] : null;
  } catch {
    return null;
  }
}

// ─── SCORING ─────────────────────────────────────────────
// WORKAROUND 4: Weight cap — any single artist contributes at most 5 points,
// so one famous listed artist can't dominate 15 unlisted ones.
const MAX_ARTIST_WEIGHT = 5;

async function scoreArtists(items, token) {
  const scores = {};
  let unlisted = [];

  for (let i = 0; i < items.length; i++) {
    const artist = items[i];
    const weight = Math.min(MAX_ARTIST_WEIGHT, Math.max(1, items.length - i));
    const name   = artist.name.toLowerCase();

    // Try direct lookup first, then name pattern
    const card = ARTIST_CARDS[name] || cardFromName(artist.name);
    if (card) {
      scores[card] = (scores[card] || 0) + weight;
    } else {
      // Collect unlisted artists for related-artist inference (top 5 only)
      if (unlisted.length < 5) unlisted.push({ artist, weight });
    }
  }

  // Related artist inference for unlisted top artists
  if (token) {
    await Promise.all(unlisted.map(async ({ artist, weight }) => {
      const card = await inferCardFromRelated(artist, token);
      if (card) scores[card] = (scores[card] || 0) + weight * 0.5; // half weight for inferred
    }));
  }

  return scores;
}

function topCard(scores) {
  const ranked = Object.entries(scores).sort((a, b) => b[1] - a[1]);
  return ranked.length > 0 ? ranked[0][0] : 'Wheel of Fortune';
}

// ─── NARRATIVE ───────────────────────────────────────────
async function buildNarrative({ longArtists, shortArtists }, token) {
  const longItems  = longArtists.items  || [];
  const shortItems = shortArtists.items || [];

  const longNames  = new Set(longItems.map(a => a.name));
  const shortNames = new Set(shortItems.map(a => a.name));
  const departed   = longItems.filter(a => !shortNames.has(a.name));
  const arrived    = shortItems.filter(a => !longNames.has(a.name));

  const overlapCount = shortItems.filter(a => longNames.has(a.name)).length;
  const stability    = shortItems.length > 0 ? overlapCount / shortItems.length : 1;

  // Score both time ranges using the multi-strategy scorer
  const [longScores, shortScores] = await Promise.all([
    scoreArtists(longItems, token),
    scoreArtists(shortItems.length ? shortItems : longItems, token),
  ]);

  const pastCard    = topCard(longScores);
  const presentCard = topCard(shortScores);

  let futureCard;
  if      (stability < 0.2 && arrived.length >= 3)  futureCard = 'Death';
  else if (stability > 0.7)                          futureCard = 'Strength';
  else if (presentCard !== pastCard)                 futureCard = presentCard;
  else                                               futureCard = 'Wheel of Fortune';

  return {
    pastCard, presentCard, futureCard,
    longArtist1:  longItems[0]?.name  || 'your longtime artists',
    longArtist2:  longItems[1]?.name  || null,
    shortArtist1: shortItems[0]?.name || longItems[0]?.name || 'your recent artists',
    shortArtist2: shortItems[1]?.name || null,
    departedName: departed[0]?.name   || null,
    arrivedName:  arrived[0]?.name    || null,
  };
}

// ─── PKCE ────────────────────────────────────────────────
function randomString(len) {
  const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
  return Array.from(crypto.getRandomValues(new Uint8Array(len))).map(b => chars[b % chars.length]).join('');
}
async function makeChallenge(verifier) {
  const digest = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(verifier));
  return btoa(String.fromCharCode(...new Uint8Array(digest))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=/g,'');
}
async function login() {
  const verifier = randomString(64);
  const challenge = await makeChallenge(verifier);
  sessionStorage.setItem('pkce_verifier', verifier);
  window.location.href = 'https://accounts.spotify.com/authorize?' + new URLSearchParams({ client_id: CLIENT_ID, response_type: 'code', redirect_uri: REDIRECT_URI, scope: 'user-top-read', code_challenge_method: 'S256', code_challenge: challenge });
}
async function exchangeToken(code) {
  const res = await fetch('https://accounts.spotify.com/api/token', { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body: new URLSearchParams({ client_id: CLIENT_ID, grant_type: 'authorization_code', code, redirect_uri: REDIRECT_URI, code_verifier: sessionStorage.getItem('pkce_verifier') }) });
  return res.json();
}

// ─── SPOTIFY ─────────────────────────────────────────────
async function spotifyGet(path, token) {
  const res = await fetch('https://api.spotify.com/v1' + path, { headers: { Authorization: 'Bearer ' + token } });
  return res.json();
}
async function fetchMusicData(token) {
  const [longArtists, shortArtists] = await Promise.all([
    spotifyGet('/me/top/artists?limit=20&time_range=long_term',  token),
    spotifyGet('/me/top/artists?limit=20&time_range=short_term', token),
  ]);
  return { longArtists, shortArtists };
}

// ─── FLIP ────────────────────────────────────────────────
function flipCard(el) {
  if (!el.classList.contains('revealed')) return;
  el.querySelector('.card-inner').classList.toggle('flipped');
}

// ─── RENDER ──────────────────────────────────────────────
const app = document.getElementById('app');

function renderLanding() {
  app.innerHTML = `<div class="landing"><span class="moon">☽</span><h1>Music Tarot</h1><div class="ornament"><div class="ornament-line"></div><span class="ornament-dot">✦</span><div class="ornament-line"></div></div><p>The cards do not lie.<br>Neither does your Spotify history.</p><button class="btn-connect" onclick="login()">Connect Spotify</button></div>`;
}
function renderLoading() {
  app.innerHTML = `<div class="loading"><span class="spinner">✦</span><p>Consulting the cards&hellip;</p></div>`;
}
function renderReading(n) {
  const cards = [
    { position: 'The Past',    card: n.pastCard,    reading: READINGS[n.pastCard]?.past(n)       || '' },
    { position: 'The Present', card: n.presentCard, reading: READINGS[n.presentCard]?.present(n) || '' },
    { position: 'The Future',  card: n.futureCard,  reading: READINGS[n.futureCard]?.future(n)   || '' },
  ];
  const cardsHtml = cards.map((card, i) => {
    const arc = ARCANA[card.card] || { num: '?', sym: '✦', file: null };
    const backHtml = arc.file !== null
      ? `<img src="${arc.file}.jpg" alt="${card.card}" />`
      : `<div class="card-back-placeholder"><span>${arc.sym}</span><p>illustration coming soon</p></div>`;
    return `<div class="tarot-card" id="card-${i}" onclick="flipCard(this)"><div class="card-inner"><div class="card-front"><div class="card-position">${card.position}</div><div class="card-numeral">${arc.num}</div><span class="card-symbol">${arc.sym}</span><div class="card-name">${card.card}</div><div class="card-rule"></div><p class="card-reading">${card.reading}</p></div><div class="card-back">${backHtml}</div></div></div>`;
  }).join('');
  app.innerHTML = `<div class="reading"><div class="reading-header"><h2>Your Reading</h2><p>Three cards drawn from the archive of your soul</p></div><div class="cards-grid">${cardsHtml}</div><p class="flip-hint">✦ &nbsp; click any card to reveal its illustration &nbsp; ✦</p></div>`;
  cards.forEach((_, i) => setTimeout(() => document.getElementById('card-' + i)?.classList.add('revealed'), 200 + i * 450));
}
function renderError(msg) {
  app.innerHTML = `<div class="error-state"><p>✦ &nbsp; ${msg}</p><button class="restart-btn" onclick="renderLanding()">Try Again</button></div>`;
}

// ─── INIT ────────────────────────────────────────────────
async function init() {
  const params = new URLSearchParams(window.location.search);
  const code   = params.get('code');
  const error  = params.get('error');
  if (error) { renderLanding(); return; }
  if (code) {
    window.history.replaceState({}, '', window.location.pathname);
    renderLoading();
    try {
      const tokenData = await exchangeToken(code);
      if (!tokenData.access_token) throw new Error('Spotify did not return a token — double-check the redirect URI in your Spotify dashboard matches exactly: ' + REDIRECT_URI);
      const musicData = await fetchMusicData(tokenData.access_token);
      if (!musicData.longArtists.items?.length && !musicData.shortArtists.items?.length) throw new Error('No artist data returned from Spotify. Make sure you have some listening history and try again.');
      const narrative = await buildNarrative(musicData, tokenData.access_token);
      renderReading(narrative);
    } catch(e) {
      renderError(e.message || 'The stars are misaligned. Please try again.');
    }
    return;
  }
  renderLanding();
}

init();
