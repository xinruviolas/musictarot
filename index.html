<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Music Tarot</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Crimson+Text:ital,wght@0,400;1,400&display=swap" rel="stylesheet" />
  <style>
    :root {
      --gold: #c9a84c;

      font-family: 'Crimson Text', Georgia, serif;

      overflow-x: hidden;
    }
    body::before {
      content: '';
      position: fixed;

        radial-gradient(1.5px 1.5px at 88% 60%, rgba(255,255,255,0.5) 0%, transparent 100%),
        radial-gradient(1px 1px at 14% 88%, rgba(255,255,255,0.4) 0%, transparent 100%),
        radial-gradient(1px 1px at 44% 75%, rgba(255,255,255,0.3) 0%, transparent 100%),
        radial-gradient(1px 1px at 93% 15%, rgba(255,255,255,0.6) 0%, transparent 100%),
        radial-gradient(1px 1px at 30% 35%, rgba(255,255,255,0.4) 0%, transparent 100%),
        radial-gradient(1px 1px at 60% 22%, rgba(255,255,255,0.5) 0%, transparent 100%),
        radial-gradient(1.5px 1.5px at  5% 50%, rgba(255,255,255,0.5) 0%, transparent 100%),
        radial-gradient(1px 1px at 55% 95%, rgba(255,255,255,0.4) 0%, transparent 100%);

      z-index: 0;
    }
    #app {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 3rem 1.5rem;

    /* LANDING */
    .landing { text-align: center; max-width: 420px; }
    .landing .moon {
      display: block; font-size: 3.5rem; color: var(--gold);

      font-weight: 400; color: var(--gold); letter-spacing: 0.12em;
    }
    .ornament {
      display: flex; align-items: center; gap: 1rem;
      margin: 1.5rem auto; width: fit-content;
    }
    .ornament-line { width: 60px; height: 1px; background: var(--gold-mid); }
    .ornament-dot  { font-size: 0.6rem; color: var(--gold); }
    .landing p {
      font-size: 1.2rem; font-style: italic; color: var(--text-dim);
      line-height: 1.8; margin-bottom: 2.5rem;
    }

      background: transparent; color: var(--gold); border: 1px solid var(--gold);

      cursor: pointer; transition: background 0.3s, color 0.3s;
    }
    .btn-connect:hover { background: var(--gold); color: var(--bg); }

    /* LOADING */
    .loading { text-align: center; }
    .loading .spinner {
      display: block; font-size: 2.5rem; color: var(--gold);
      margin-bottom: 1.5rem; animation: spin 5s linear infinite;
    }

      letter-spacing: 0.25em; text-transform: uppercase; color: var(--text-dim);

      font-family: 'Cinzel', serif; font-size: 1.6rem;

    .tarot-card::after {

    .card-position {

// ─── ARCANA ──────────────────────────────────────────────
const ARCANA = {

// ─── CARD SELECTION ──────────────────────────────────────
// f = { valence, energy, danceability, acousticness, instrumentalness, speechiness, tempo }

function pickCard(f) {
  if (f.instrumentalness > 0.40)                  return 'The High Priestess';
  if (f.energy > 0.72 && f.valence < 0.38)        return 'The Tower';
  if (f.energy > 0.70 && f.valence > 0.62)        return 'The Sun';
  if (f.energy < 0.38 && f.valence < 0.42)        return 'The Moon';
  if (f.acousticness > 0.55 && f.energy < 0.52)   return 'The Hermit';
  if (f.danceability > 0.72 && f.valence > 0.58)  return 'The World';
  if (f.speechiness > 0.12)                       return 'The Magician';
  if (f.tempo > 142 && f.energy > 0.62)           return 'The Chariot';
  if (f.valence > 0.60 && f.acousticness > 0.38)  return 'The Star';
  if (f.energy > 0.58 && f.valence < 0.42)        return 'The Devil';
  if (f.valence > 0.58 && f.danceability > 0.60)  return 'The Lovers';
  return 'Wheel of Fortune';
}

function pickFutureCard(longF, shortF) {
  const dValence  = shortF.valence - longF.valence;
  const dEnergy   = shortF.energy  - longF.energy;
  const dAcoustic = shortF.acousticness - longF.acousticness;
  const dDance    = shortF.danceability - longF.danceability;

  const biggest = Math.max(Math.abs(dValence), Math.abs(dEnergy), Math.abs(dAcoustic), Math.abs(dDance));
  if (biggest < 0.07) return 'Strength';

  if (Math.abs(dValence)  === biggest) return dValence  > 0 ? 'The Sun'    : 'The Moon';
  if (Math.abs(dEnergy)   === biggest) return dEnergy   > 0 ? 'The Tower'  : 'The Star';
  if (Math.abs(dAcoustic) === biggest) return dAcoustic > 0 ? 'The Hermit' : 'The Magician';
  if (Math.abs(dDance)    === biggest) return dDance    > 0 ? 'The World'  : 'The Lovers';
  return 'Wheel of Fortune';
}

// ─── HELPERS ─────────────────────────────────────────────
function avgFeatures(list) {
  const valid = list.filter(f => f && f.valence != null);
  if (!valid.length) return null;
  const keys = ['valence','energy','danceability','acousticness','instrumentalness','speechiness','tempo'];
  const avg = {};
  for (const k of keys) avg[k] = valid.reduce((s, f) => s + f[k], 0) / valid.length;
  return avg;
}

// ─── PKCE ────────────────────────────────────────────────
function randomString(len) {
  const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
  return Array.from(crypto.getRandomValues(new Uint8Array(len)))
    .map(b => chars[b % chars.length]).join('');
}

async function makeChallenge(verifier) {
  const digest = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(verifier));
  return btoa(String.fromCharCode(...new Uint8Array(digest)))
    .replace(/\+/g,'-').replace(/\//g,'_').replace(/=/g,'');
}

async function login() {
  const verifier  = randomString(64);
  const challenge = await makeChallenge(verifier);
  sessionStorage.setItem('pkce_verifier', verifier);
  window.location.href = 'https://accounts.spotify.com/authorize?' + new URLSearchParams({
    client_id: CLIENT_ID, response_type: 'code', redirect_uri: REDIRECT_URI,
    scope: 'user-top-read', code_challenge_method: 'S256', code_challenge: challenge,
  });
}

async function exchangeToken(code) {
  const res = await fetch('https://accounts.spotify.com/api/token', {
    method: 'POST',
    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
    body: new URLSearchParams({
      client_id: CLIENT_ID, grant_type: 'authorization_code',
      code, redirect_uri: REDIRECT_URI,
      code_verifier: sessionStorage.getItem('pkce_verifier'),
    }),
  });
  return res.json();
}

// ─── SPOTIFY ─────────────────────────────────────────────
async function spotifyGet(path, token) {
  const res = await fetch('https://api.spotify.com/v1' + path, {
    headers: { Authorization: 'Bearer ' + token },
  });
  return res.json();
}

async function fetchMusicData(token) {
  const [longTracks, shortTracks, longArtists, shortArtists] = await Promise.all([
    spotifyGet('/me/top/tracks?limit=20&time_range=long_term',  token),
    spotifyGet('/me/top/tracks?limit=20&time_range=short_term', token),
    spotifyGet('/me/top/artists?limit=5&time_range=long_term',  token),
    spotifyGet('/me/top/artists?limit=5&time_range=short_term', token),
  ]);

  // Batch-fetch audio features for both sets of tracks
  const longIds  = longTracks.items?.map(t => t.id).join(',')  || '';
  const shortIds = shortTracks.items?.map(t => t.id).join(',') || '';

  const [longFeatures, shortFeatures] = await Promise.all([
    longIds  ? spotifyGet('/audio-features?ids=' + longIds,  token) : { audio_features: [] },
    shortIds ? spotifyGet('/audio-features?ids=' + shortIds, token) : { audio_features: [] },
  ]);

  return {
    longTracks, shortTracks, longArtists, shortArtists,
    longFeatures:  longFeatures.audio_features  || [],
    shortFeatures: shortFeatures.audio_features || [],
  };
}

// ─── BUILD READING ───────────────────────────────────────
function buildReading(data) {
  const { longTracks, shortTracks, longArtists, shortArtists, longFeatures, shortFeatures } = data;

  const longAvg  = avgFeatures(longFeatures);
  const shortAvg = avgFeatures(shortFeatures);

  if (!longAvg || !shortAvg) throw new Error('Not enough listening history yet — try again after using Spotify more.');

  const pastCard    = pickCard(longAvg);
  const presentCard = pickCard(shortAvg);
  const futureCard  = pickFutureCard(longAvg, shortAvg);

  const longContext = {
    a1: longArtists.items?.[0]?.name  || longTracks.items?.[0]?.artists?.[0]?.name || 'your artists',
    a2: longArtists.items?.[1]?.name  || 'others',
    t1: longTracks.items?.[0]?.name   || 'your songs',
  };
  const shortContext = {
    a1: shortArtists.items?.[0]?.name || shortTracks.items?.[0]?.artists?.[0]?.name || 'your recent artists',
    a2: shortArtists.items?.[1]?.name || 'others',
    t1: shortTracks.items?.[0]?.name  || 'your recent songs',
  };
  const futureContext = shortContext; // future leans toward where they're going

  return [
    {
      position: 'The Past',
      card:     pastCard,
      reading:  READINGS[pastCard].past(longContext),
      artists:  longArtists.items?.slice(0,3).map(a => a.name).join(' · ') || '',
    },
    {
      position: 'The Present',
      card:     presentCard,
      reading:  READINGS[presentCard].present(shortContext),
      artists:  shortArtists.items?.slice(0,3).map(a => a.name).join(' · ') || '',
    },
    {
      position: 'The Future',
      card:     futureCard,
      reading:  READINGS[futureCard].future(futureContext),
      artists:  shortTracks.items?.slice(0,3).map(t => t.name).join(' · ') || '',
    },
  ];
}

    return `
      <div class="tarot-card" id="card-${i}">
        <div class="card-position">${card.position}</div>
        <div class="card-numeral">${arc.num}</div>
        <span class="card-symbol">${arc.sym}</span>
        <div class="card-name">${card.card}</div>
        <div class="card-rule"></div>
        <p class="card-reading">${card.reading}</p>
        ${card.artists ? `<p class="card-artists">${card.artists}</p>` : ''}
      </div>`;
  }).join('');

  app.innerHTML = `
    <div class="reading">
      <div class="reading-header">
        <h2>Your Reading</h2>
        <p>Three cards drawn from the archive of your soul</p>
      </div>
      <div class="cards-grid">${cardsHtml}</div>
      <button class="restart-btn" onclick="renderLanding()">✦ &nbsp; Draw Again</button>
    </div>`;

  cards.forEach((_, i) => {
    setTimeout(() => document.getElementById('card-' + i)?.classList.add('revealed'), 200 + i * 450);
  });
}

function renderError(msg) {
  app.innerHTML = `
    <div class="error-state">
      <p>✦ &nbsp; ${msg}</p>
      <button class="restart-btn" onclick="renderLanding()">Try Again</button>
    </div>`;
}

// ─── INIT ────────────────────────────────────────────────
async function init() {
  const params = new URLSearchParams(window.location.search);
  const code   = params.get('code');
  const error  = params.get('error');

  if (error) { renderLanding(); return; }

  if (code) {
    window.history.replaceState({}, '', window.location.pathname);
    renderLoading();
    try {
      const tokenData = await exchangeToken(code);
      if (!tokenData.access_token) throw new Error('Spotify did not return a token. Check that your redirect URI in the Spotify dashboard matches exactly: ' + REDIRECT_URI);
      const musicData = await fetchMusicData(tokenData.access_token);
      const cards     = buildReading(musicData);
      renderReading(cards);
    } catch(e) {
      renderError(e.message || 'The stars are misaligned. Please try again.');
    }
    return;
  }

  renderLanding();
}

init();
</script>
</body>
</html>
