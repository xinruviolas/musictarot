<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Music Tarot</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Crimson+Text:ital,wght@0,400;1,400&display=swap" rel="stylesheet" />
  <style>
    :root {
      --gold: #c9a84c;
      --gold-dim: rgba(201, 168, 76, 0.25);
      --gold-mid: rgba(201, 168, 76, 0.5);
      --bg: #07070f;
      --card-bg: #0c0c1a;
      --text: #e8e0d0;
      --text-dim: rgba(232, 224, 208, 0.45);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg); color: var(--text);
      font-family: 'Crimson Text', Georgia, serif;
      min-height: 100vh; overflow-x: hidden;
    }
    body::before {
      content: ''; position: fixed; inset: 0;
      background-image:
        radial-gradient(1px 1px at  8% 12%, rgba(255,255,255,0.7) 0%, transparent 100%),
        radial-gradient(1px 1px at 22% 68%, rgba(255,255,255,0.5) 0%, transparent 100%),
        radial-gradient(1.5px 1.5px at 38%  8%, rgba(255,255,255,0.6) 0%, transparent 100%),
        radial-gradient(1px 1px at 51% 45%, rgba(255,255,255,0.4) 0%, transparent 100%),
        radial-gradient(1px 1px at 67% 82%, rgba(255,255,255,0.6) 0%, transparent 100%),
        radial-gradient(1px 1px at 75% 28%, rgba(255,255,255,0.3) 0%, transparent 100%),
        radial-gradient(1.5px 1.5px at 88% 60%, rgba(255,255,255,0.5) 0%, transparent 100%),
        radial-gradient(1px 1px at 14% 88%, rgba(255,255,255,0.4) 0%, transparent 100%),
        radial-gradient(1px 1px at 44% 75%, rgba(255,255,255,0.3) 0%, transparent 100%),
        radial-gradient(1px 1px at 93% 15%, rgba(255,255,255,0.6) 0%, transparent 100%),
        radial-gradient(1px 1px at 30% 35%, rgba(255,255,255,0.4) 0%, transparent 100%),
        radial-gradient(1px 1px at 60% 22%, rgba(255,255,255,0.5) 0%, transparent 100%),
        radial-gradient(1.5px 1.5px at  5% 50%, rgba(255,255,255,0.5) 0%, transparent 100%),
        radial-gradient(1px 1px at 55% 95%, rgba(255,255,255,0.4) 0%, transparent 100%);
      pointer-events: none; z-index: 0;
    }
    #app {
      position: relative; z-index: 1; min-height: 100vh;
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; padding: 3rem 1.5rem;
    }
    .landing { text-align: center; max-width: 420px; }
    .landing .moon {
      display: block; font-size: 3.5rem; color: var(--gold);
      margin-bottom: 1.75rem; animation: breathe 4s ease-in-out infinite;
    }
    @keyframes breathe {
      0%, 100% { opacity: 0.6; transform: scale(1); }
      50%       { opacity: 1;   transform: scale(1.06); }
    }
    .landing h1 {
      font-family: 'Cinzel', serif; font-size: 2.6rem;
      font-weight: 400; color: var(--gold); letter-spacing: 0.12em;
    }
    .ornament { display: flex; align-items: center; gap: 1rem; margin: 1.5rem auto; width: fit-content; }
    .ornament-line { width: 60px; height: 1px; background: var(--gold-mid); }
    .ornament-dot  { font-size: 0.6rem; color: var(--gold); }
    .landing p { font-size: 1.2rem; font-style: italic; color: var(--text-dim); line-height: 1.8; margin-bottom: 2.5rem; }
    .btn-connect {
      background: transparent; color: var(--gold); border: 1px solid var(--gold);
      padding: 0.9rem 2.2rem; font-family: 'Cinzel', serif; font-size: 0.8rem;
      letter-spacing: 0.2em; text-transform: uppercase; cursor: pointer;
      transition: background 0.3s, color 0.3s;
    }
    .btn-connect:hover { background: var(--gold); color: var(--bg); }
    .loading { text-align: center; }
    .loading .spinner {
      display: block; font-size: 2.5rem; color: var(--gold);
      margin-bottom: 1.5rem; animation: spin 5s linear infinite;
    }
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    .loading p { font-family: 'Cinzel', serif; font-size: 0.75rem; letter-spacing: 0.25em; text-transform: uppercase; color: var(--text-dim); }
    .reading { max-width: 860px; width: 100%; }
    .reading-header { text-align: center; margin-bottom: 3rem; }
    .reading-header h2 { font-family: 'Cinzel', serif; font-size: 1.6rem; font-weight: 400; color: var(--gold); letter-spacing: 0.1em; margin-bottom: 0.5rem; }
    .reading-header p { font-style: italic; color: var(--text-dim); font-size: 1.05rem; }
    .cards-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.75rem; margin-bottom: 1rem; }
    @media (max-width: 600px) { .cards-grid { grid-template-columns: 1fr; max-width: 260px; margin: 0 auto 1rem; } }
    .tarot-card {
      background: var(--card-bg); border: 1px solid var(--gold-mid);
      padding: 1.75rem 1.25rem 1.5rem; position: relative;
      opacity: 0; transform: translateY(24px);
      transition: opacity 0.7s ease, transform 0.7s ease;
    }
    .tarot-card.revealed { opacity: 1; transform: translateY(0); }
    .tarot-card::before { content: ''; position: absolute; inset: 6px; border: 1px solid var(--gold-dim); pointer-events: none; }
    .tarot-card::after { content: '✦'; position: absolute; bottom: 12px; right: 12px; font-size: 0.5rem; color: var(--gold-dim); }
    .card-position { font-family: 'Cinzel', serif; font-size: 0.6rem; letter-spacing: 0.3em; text-transform: uppercase; color: var(--text-dim); text-align: center; margin-bottom: 1.25rem; }
    .card-numeral { font-family: 'Cinzel', serif; font-size: 0.7rem; letter-spacing: 0.25em; color: var(--gold-dim); text-align: center; margin-bottom: 0.4rem; }
    .card-symbol { display: block; font-size: 2.2rem; text-align: center; color: var(--gold); margin: 0.4rem 0; }
    .card-name { font-family: 'Cinzel', serif; font-size: 0.95rem; font-weight: 600; color: var(--gold); text-align: center; letter-spacing: 0.05em; margin-bottom: 1.25rem; }
    .card-rule { width: 36px; height: 1px; background: var(--gold-mid); margin: 0 auto 1.25rem; }
    .card-reading { font-size: 0.95rem; line-height: 1.85; color: var(--text); font-style: italic; text-align: center; }
    .error-state { text-align: center; }
    .error-state p { color: #b07070; font-style: italic; font-size: 1.1rem; margin-bottom: 1.5rem; }
    .restart-btn {
      display: block; margin: 0 auto; background: transparent; color: var(--text-dim);
      border: 1px solid rgba(232,224,208,0.15); padding: 0.6rem 1.75rem;
      font-family: 'Cinzel', serif; font-size: 0.65rem; letter-spacing: 0.25em;
      text-transform: uppercase; cursor: pointer; transition: all 0.3s;
    }
    .restart-btn:hover { color: var(--text); border-color: rgba(232,224,208,0.4); }
  </style>
</head>
<body>
<div id="app"></div>
<script>
const CLIENT_ID    = 'bc450906c5684edc9b0904ae3e221273';
const REDIRECT_URI = 'https://xinruli.com/musictarot/';

// ─── ALL 22 MAJOR ARCANA ─────────────────────────────────
const ARCANA = {
  'The Fool':           { num: 'O',     sym: '◌' },
  'The Magician':       { num: 'I',     sym: '⌖' },
  'The High Priestess': { num: 'II',    sym: '☽' },
  'The Empress':        { num: 'III',   sym: '✦' },
  'The Emperor':        { num: 'IV',    sym: '◈' },
  'The Hierophant':     { num: 'V',     sym: '⊕' },
  'The Lovers':         { num: 'VI',    sym: '⌘' },
  'The Chariot':        { num: 'VII',   sym: '◬' },
  'Strength':           { num: 'VIII',  sym: '∞' },
  'The Hermit':         { num: 'IX',    sym: '◉' },
  'Wheel of Fortune':   { num: 'X',     sym: '⊛' },
  'Justice':            { num: 'XI',    sym: '⌬' },
  'The Hanged Man':     { num: 'XII',   sym: '⊗' },
  'Death':              { num: 'XIII',  sym: '⊘' },
  'Temperance':         { num: 'XIV',   sym: '◇' },
  'The Devil':          { num: 'XV',    sym: '⋈' },
  'The Tower':          { num: 'XVI',   sym: '⚡' },
  'The Star':           { num: 'XVII',  sym: '✧' },
  'The Moon':           { num: 'XVIII', sym: '☾' },
  'The Sun':            { num: 'XIX',   sym: '☀' },
  'Judgement':          { num: 'XX',    sym: '◎' },
  'The World':          { num: 'XXI',   sym: '⊙' },
};

// ─── GENRE RULES ─────────────────────────────────────────
// Strength, Wheel of Fortune, and Death are narrative cards — no genre rules.
// All others are matched by keyword against Spotify genre tags.
const GENRE_RULES = [
  { card: 'The Fool',           keywords: ['hyperpop','pc music','digicore','glitchcore','bubblegum bass','avant-pop','deconstructed club','noise pop','experimental pop'] },
  { card: 'The Magician',       keywords: ['hip hop','rap','trap','drill','boom bap','east coast hip hop','west coast hip hop','southern hip hop','g funk','gangster rap'] },
  { card: 'The High Priestess', keywords: ['ambient','neoclassical','new age','meditation','post-classical','contemporary classical','modern classical','minimalism','piano'] },
  { card: 'The Empress',        keywords: ['baroque pop','orchestral pop','chamber pop','symphonic','art pop','theatrical','glam','cinematic','operatic'] },
  { card: 'The Emperor',        keywords: ['classic rock','hard rock','stadium rock','progressive rock','arena rock','album rock','proto-metal','opera','symphonic rock'] },
  { card: 'The Hierophant',     keywords: ['gospel','spiritual','sacred','choral','devotional','christian','worship','hymn','soul gospel'] },
  { card: 'The Lovers',         keywords: ['jazz','bossa nova','jazz pop','vocal jazz','swing','bebop','jazz fusion','quiet storm','smooth jazz','jazz vocals'] },
  { card: 'The Chariot',        keywords: ['drum and bass','jungle','techno','punk','post-punk','garage rock','breakbeat','speedcore','footwork'] },
  { card: 'The Hermit',         keywords: ['folk','acoustic','singer-songwriter','americana','bluegrass','country folk','appalachian','chamber folk','anti-folk','indie folk'] },
  { card: 'Justice',            keywords: ['conscious','protest','political','afrobeat','reggae','ska','activist','revolutionary','folk protest'] },
  { card: 'The Hanged Man',     keywords: ['drone','dark ambient','musique concrete','lowercase','field recording','isolationism','tape music','microsound'] },
  { card: 'Temperance',         keywords: ['r&b','neo soul','soul','alternative r&b','indie r&b','funk soul','motown','quiet storm'] },
  { card: 'The Devil',          keywords: ['witch house','dark pop','occult','stoner rock','psychedelic rock','psychedelic pop','krautrock','gothic rock','darkwave','industrial'] },
  { card: 'The Tower',          keywords: ['metal','hardcore','grindcore','death metal','thrash metal','black metal','mathcore','powerviolence','heavy metal','noise rock'] },
  { card: 'The Star',           keywords: ['indie pop','lo-fi','bedroom pop','chillwave','dream pop','jangle pop','twee','college rock','alternative pop'] },
  { card: 'The Moon',           keywords: ['emo','screamo','slowcore','shoegaze','goth','doom','sadcore','melancholia','emo pop','midwest emo','post-rock'] },
  { card: 'The Sun',            keywords: ['pop','dance pop','electropop','k-pop','j-pop','bubblegum pop','teen pop','power pop','synth pop'] },
  { card: 'Judgement',          keywords: ['anthemic','orchestral indie','post-metal','epic','progressive indie','art rock','chamber indie','cinematic indie'] },
  { card: 'The World',          keywords: ['house','edm','disco','funk','afro house','tropical house','nu disco','dance','electronic dance','club'] },
];

function scoreGenres(genres) {
  const joined = genres.join(' ').toLowerCase();
  const scores = {};
  for (const rule of GENRE_RULES) {
    const hits = rule.keywords.filter(kw => joined.includes(kw)).length;
    if (hits > 0) scores[rule.card] = (scores[rule.card] || 0) + hits;
  }
  return scores;
}

function topCard(scores) {
  const ranked = Object.entries(scores).sort((a, b) => b[1] - a[1]);
  return ranked.length > 0 ? ranked[0][0] : 'Wheel of Fortune';
}

// ─── READINGS ────────────────────────────────────────────
// Each card has past/present/future functions receiving the full narrative object n.
// n = { longArtist1, longArtist2, shortArtist1, shortArtist2, departedName, arrivedName,
//        stability, pastCard, presentCard, futureCard, newGenres }

const a2str = n => n.longArtist2 ? ` and ${n.longArtist2}` : '';
const sa2str = n => n.shortArtist2 ? ` and ${n.shortArtist2}` : '';

const READINGS = {

  'The Fool': {
    past:    n => `${n.longArtist1}${a2str(n)} — your all-time taste has always had a chaotic streak. The Fool doesn't pick a lane. More accurately: The Fool doesn't believe lanes exist.`,
    present: n => n.arrivedName && n.departedName
      ? `${n.departedName} gave way to ${n.arrivedName} and the logic isn't obvious to anyone but you. The Fool moves by instinct. The pivot makes sense from the inside.`
      : `${n.shortArtist1} is in your current rotation, and The Fool approves. Right now you're reaching for something nobody has fully named yet.`,
    future:  n => `Your taste is becoming less explainable, not more. The Fool says: correct. Something chaotic and entirely your own is still forming.`,
  },

  'The Magician': {
    past:    n => `${n.longArtist1}${a2str(n)} — music where language is the primary instrument, where the lyric lands like something you needed to hear said plainly. The Magician rules words as power. Your history confirms: you've always been drawn to artists who use them precisely.`,
    present: n => n.arrivedName && n.departedName
      ? `${n.departedName} receded; ${n.arrivedName} arrived with something specific to say. The Magician doesn't stay where the conversation has gone quiet.`
      : `${n.shortArtist1} keeps playing. The Magician is the card of will and articulation — right now you're drawn to music that says exactly what it means.`,
    future:  n => `Your taste is moving toward the direct and intentional. What's coming requires precision. Your ears are already practicing.`,
  },

  'The High Priestess': {
    past:    n => `${n.longArtist1}${a2str(n)} — music that lives below language, felt before it is understood. This has been your home for years. The High Priestess does not explain herself, and neither have you.`,
    present: n => n.arrivedName && n.departedName
      ? `${n.departedName} has receded; ${n.arrivedName} has arrived quieter, more interior. The High Priestess governs the music you put on when you need to think without interruption.`
      : `${n.shortArtist1} keeps playing, and you don't need to explain it to anyone. You are processing something you haven't named yet.`,
    future:  n => `The direction is inward. What's coming is quieter, more interior, less concerned with being understood. The High Priestess does not perform — she knows. Your taste is moving the same way.`,
  },

  'The Empress': {
    past:    n => `${n.longArtist1}${a2str(n)} — your all-time taste gravitates toward the lush, the theatrical, the deliberately grand. The Empress doesn't do restraint. Neither have you.`,
    present: n => n.arrivedName && n.departedName
      ? `${n.departedName} has receded; ${n.arrivedName} has arrived with more drama, more texture. The Empress always finds her way to the most sumptuous thing in the room.`
      : `${n.shortArtist1} is where you are right now — maximalist, sensory, larger than life. The Empress rules abundance. Your current listening is in full bloom.`,
    future:  n => `More grandeur, more sensation — that's the direction. The Empress does not arrive subtly. Neither will what's coming.`,
  },

  'The Emperor': {
    past:    n => `${n.longArtist1}${a2str(n)} — your all-time taste has always had architecture to it. Grand structures, deliberate power, music that occupies a room before anyone speaks. The Emperor builds to last.`,
    present: n => n.arrivedName && n.departedName
      ? `${n.departedName} has given way to ${n.arrivedName} — the scale hasn't changed, only the form. The Emperor rebuilds but never shrinks.`
      : `${n.shortArtist1} is where you are — music of scale and authority. The Emperor doesn't ask for attention. He occupies space until attention arrives on its own.`,
    future:  n => `Something large is forming. The Emperor suggests the next chapter has weight to it — music that means something beyond the moment it's played.`,
  },

  'The Hierophant': {
    past:    n => `${n.longArtist1}${a2str(n)} — your all-time taste has a devotional quality. Music as ritual, as practice, as something returned to again and again for more than pleasure. The Hierophant keeps the tradition.`,
    present: n => n.arrivedName && n.departedName
      ? `${n.arrivedName} has entered where ${n.departedName} used to be. The ritual continues with a new scripture. The Hierophant adapts the form; he never abandons the practice.`
      : `${n.shortArtist1} keeps playing — music you return to like a practice. The Hierophant governs music that feels like it belongs to something larger than a single listen.`,
    future:  n => `The Hierophant suggests continuity. What's coming is not reinvention — it's deepening. You are moving further into something, not away from it.`,
  },

  'The Lovers': {
    past:    n => `${n.longArtist1}${a2str(n)} — music that makes you feel understood, that sounds like it was made for you specifically. The Lovers is not just romance. It is resonance. You've always known the difference.`,
    present: n => n.arrivedName && n.departedName
      ? `${n.arrivedName} is new and already essential — something in the intimacy of it, the way it sounds like a conversation. ${n.departedName} served its season.`
      : `${n.shortArtist1} keeps coming up. Your current listening is warm, intimate, emotionally available. The Lovers suggests a season of resonance — music that meets you exactly where you are.`,
    future:  n => `More warmth, more openness — that's where this is going. The Lovers asks you to stop armoring and start receiving. Your playlist is already there.`,
  },

  'The Chariot': {
    past:    n => `${n.longArtist1}${a2str(n)} at full speed — your history reads like someone who has always moved with intention. The Chariot is not impulsive. It is disciplined momentum. You don't drift.`,
    present: n => n.arrivedName && n.departedName
      ? `${n.arrivedName} entered fast and hasn't let up. ${n.departedName} is in the rearview. The Chariot keeps moving — it doesn't slow down to look back.`
      : `${n.shortArtist1} is doing what The Chariot demands: forward motion, no hesitation. You know what you want and you're not slowing down to second-guess it.`,
    future:  n => `The momentum is building. The Chariot doesn't promise easy — it promises direction. What's coming requires commitment. Your recent listening has already decided.`,
  },

  'Strength': {
    past:    n => `${n.longArtist1}${a2str(n)} — the same artists, returning across years. Strength is not loudness. It is endurance. Your history reflects someone who knows who they are and doesn't apologize for it.`,
    present: n => `${n.shortArtist1} still plays because it still works. Strength says some people pivot; you deepen. That's not stagnation — that's rootedness.`,
    future:  n => `Your past and present are closely aligned — the same instincts, the same pull. You are not in a season of reinvention. You are in a season of showing up, consistently, as exactly who you already are. The cards don't always predict change. Sometimes they confirm arrival.`,
  },

  'The Hermit': {
    past:    n => `${n.longArtist1}${a2str(n)} and the patience to listen all the way through — that's the thread in your history. The Hermit is not lonely. The Hermit is deliberate.`,
    present: n => n.arrivedName && n.departedName
      ? `${n.departedName} has faded; ${n.arrivedName} plays now — quieter, more demanding of attention. The Hermit moves inward by choice.`
      : `${n.shortArtist1} plays and you don't need company. The Hermit carries a lantern not to show others the way, but to see their own path clearly. That's what you're doing.`,
    future:  n => `Your listening is getting quieter, more stripped back. The Hermit suggests a season of intentional focus ahead — the particular clarity that comes from choosing less noise.`,
  },

  'Wheel of Fortune': {
    past:    n => `${n.longArtist1}${a2str(n)} and a dozen other things that share nothing obvious — your all-time taste refuses to be categorized. The Wheel rules eclecticism. You have always trusted your own orbit over anyone else's.`,
    present: n => `Your recent listening is varied, restless, reaching in several directions at once. The Wheel is mid-turn. Right now you are between fixed points. That's exactly right.`,
    future:  n => `The Wheel keeps turning. Your taste is diversifying in ways that don't resolve into a single direction yet. Something unexpected is coming, and your ears are already preparing without telling your brain.`,
  },

  'Justice': {
    past:    n => `${n.longArtist1}${a2str(n)} — your all-time taste has always had a moral dimension. Music that names things, that refuses to look away. The Lovers resonates; Justice insists.`,
    present: n => n.arrivedName && n.departedName
      ? `${n.departedName} has faded; ${n.arrivedName} has arrived with something to say. Justice doesn't stay where the conversation has gone quiet.`
      : `${n.shortArtist1} keeps playing. Justice is the card of truth-telling — right now you're drawn to music that says the thing plainly. That's not comfort listening. That's conviction.`,
    future:  n => `The direction is toward music that means something beyond the sound. Justice suggests conviction — in what you listen to, and probably other things too.`,
  },

  'The Hanged Man': {
    past:    n => `${n.longArtist1}${a2str(n)} — your all-time taste has always included music that suspends time rather than marks it. The Hanged Man governs deliberate stillness. You have always known how to wait inside a sound.`,
    present: n => n.arrivedName && n.departedName
      ? `${n.departedName} gave way to ${n.arrivedName} — even quieter, even more suspended. The Hanged Man descends further.`
      : `${n.shortArtist1} plays and time does something different. The Hanged Man is not passive — suspension is an active choice. Right now you are choosing stillness. That is harder than it looks.`,
    future:  n => `The direction is more suspension, less event. The Hanged Man says: what you're looking for cannot be found by moving faster.`,
  },

  'Death': {
    past:    n => `${n.longArtist1} and that entire world built up over years of listening.`,
    present: n => `${n.shortArtist1} is here now, where ${n.longArtist1} used to be — and the overlap between them is almost nothing. Death in tarot is never an ending. It is the most complete transformation available. The cards do not often see a shift this total. Something fundamental changed. The music knows it even if you don't yet.`,
    future:  n => `What's coming is not a refinement of what came before — it is a continuation of the transformation already underway. Death does not reverse. It moves through.`,
  },

  'Temperance': {
    past:    n => `${n.longArtist1}${a2str(n)} — your all-time taste blends rather than polarizes. Not maximally dark, not maximally bright, never fully one thing. Temperance is the art of balance, practiced without needing to name it.`,
    present: n => n.arrivedName && n.departedName
      ? `${n.departedName} has given way to ${n.arrivedName} — the balance shifts, but it remains balance. Temperance adapts the mixture; it never abandons the principle.`
      : `${n.shortArtist1} is where you are — music that synthesizes rather than declares. Temperance is the middle path, chosen not from indecision but from wisdom.`,
    future:  n => `The direction is toward integration. Temperance suggests the next chapter involves bringing things together rather than choosing between them.`,
  },

  'The Devil': {
    past:    n => `${n.longArtist1}${a2str(n)} — strange, relentless, a little dangerous. Your all-time taste goes places most people won't follow. The Devil rules obsession. You are loyal to your vices in exactly the right way.`,
    present: n => n.arrivedName && n.departedName
      ? `${n.arrivedName} showed up recently and you haven't been able to stop. ${n.departedName} couldn't hold you the same way anymore. The Devil names the new obsession.`
      : `${n.shortArtist1} is on heavy rotation and you know it. The Devil just names what's happening: attached in a way that goes beyond taste. That's devotion.`,
    future:  n => `Something magnetic is forming — a sound, a phase, an obsession still taking shape. You won't be able to explain it to anyone. That's fine.`,
  },

  'The Tower': {
    past:    n => `${n.longArtist1}${a2str(n)} — uncompromising, high voltage, built to shake something loose. The Tower does not play in the background. It announces itself. So have you.`,
    present: n => n.arrivedName && n.departedName
      ? `${n.departedName} gave way to ${n.arrivedName}. The intensity hasn't left — it's wearing a different face now. The Tower is still falling. You just changed which building.`
      : `${n.shortArtist1} is where you are right now — intensity without apology, energy without explanation. The Tower is not comfortable music. It is honest music.`,
    future:  n => `Something is accelerating. The Tower falls not as punishment but as permission — to stop holding together what was never meant to last.`,
  },

  'The Star': {

      ? `${n.departedName} is gone from the foreground; ${n.arrivedName} has taken its place — something more open, more reaching. The Star rises after a clearing. You may be in it.`
      : `${n.shortArtist1} keeps appearing in your recent plays — open, reaching, a little hopeful. The Star rises after something has cleared. You may be in that clearing right now.`,
    future:  n => `Something is gentling. The Star promises not triumph but renewal — the kind that comes quietly, after something has cleared, and stays longer than you expect.`,
  },

  'The Moon': {
    past:    n => `${n.longArtist1}${a2str(n)} — music that understands the 2am version of you. The Moon rules things felt before they are named. You have always lived in that territory.`,
    present: n => n.arrivedName && n.departedName
      ? `${n.arrivedName} has moved in where ${n.departedName} used to live. Something shifted toward the interior. The Moon doesn't ask you to explain it — only to keep going.`
      : `${n.shortArtist1} keeps surfacing — weighted, introspective, a little unresolved. The Moon doesn't offer answers. It illuminates just enough to keep walking.`,
    future:  n => `Something is getting quieter, more interior. The Moon says: this is not regression. This is depth. What looks like sadness from the outside is often just honesty from within.`,
  },

  'The Sun': {
    past:    n => `${n.longArtist1}${a2str(n)} — your all-time taste leans bright, energetic, unguarded. The Sun doesn't apologize for warmth. Neither have you. Joy has always been a first language.`,
    present: n => n.arrivedName && n.departedName
      ? `${n.arrivedName} is new and already feels essential — brighter energy, less ambivalence. Something lifted. ${n.departedName} was part of a heavier chapter.`
      : `${n.shortArtist1} is your current obsession, and The Sun says: correct. High energy, high warmth, no ambivalence. This is a true north revealing itself.`,
    future:  n => `More warmth is coming. The Sun does not demand you earn it — it just rises. Your listening suggests you are finally letting it. What's ahead is lighter than what came before.`,
  },

  'Judgement': {
    past:    n => `${n.longArtist1}${a2str(n)} — your all-time taste has always reached for the anthemic, the collective, music made for more than one person in a room. Judgement is the card of reckoning and awakening. Your history has always pointed there.`,
    present: n => n.arrivedName && n.departedName
      ? `${n.departedName} has given way to ${n.arrivedName} — bigger, more reaching, built for catharsis. Judgement always escalates.`
      : `${n.shortArtist1} keeps playing — big, reaching, built for collective release. Judgement is not subtle. Right now you want the music that opens something up.`,
    future:  n => `Something loud and clarifying is coming. Judgement suggests a reckoning — not destructive but illuminating. The kind of music that makes you feel part of something. You're heading toward it.`,
  },

  'The World': {
    past:    n => `${n.longArtist1}${a2str(n)} on full volume, body in motion — this has always been you at your best. The World is presence and completion. Your all-time taste confirms you know how to inhabit a moment.`,
    present: n => n.arrivedName && n.departedName
      ? `${n.departedName} was a different season; ${n.arrivedName} is here now and The World approves. You are exactly where you should be. Don't overthink it.`
      : `${n.shortArtist1} is in your current rotation and The World says you are exactly where you should be. Rare. Don't overthink it.`,
    future:  n => `More arrival, less preparing. The World says the next chapter is one where you stop rehearsing and start inhabiting. Your recent listening is already there. The rest of you is catching up.`,

// ─── NARRATIVE ───────────────────────────────────────────
function buildNarrative({ longArtists, shortArtists }) {
  const longItems  = longArtists.items  || [];
  const shortItems = shortArtists.items || [];

  function weightedGenres(items) {
    const out = [];
    items.forEach((a, i) => {
      const w = Math.max(1, items.length - i);
      for (let j = 0; j < w; j++) out.push(...(a.genres || []));
    });
    return out;
  }

  const longGenres  = weightedGenres(longItems);
  const shortGenres = weightedGenres(shortItems);

  const longNames  = new Set(longItems.map(a => a.name));
  const shortNames = new Set(shortItems.map(a => a.name));
  const departed   = longItems.filter(a => !shortNames.has(a.name));
  const arrived    = shortItems.filter(a => !longNames.has(a.name));

  const longGenreSet  = new Set(longGenres.map(g => g.toLowerCase()));
  const shortGenreSet = new Set(shortGenres.map(g => g.toLowerCase()));
  const newGenres     = [...shortGenreSet].filter(g => !longGenreSet.has(g));

  const overlapCount = shortItems.filter(a => longNames.has(a.name)).length;
  const stability    = shortItems.length > 0 ? overlapCount / shortItems.length : 1;

  const longScores  = scoreGenres(longGenres);
  const shortScores = scoreGenres(shortGenres.length ? shortGenres : longGenres);

  const pastCard    = topCard(longScores);
  const presentCard = topCard(shortScores);

  // Future card: three possible paths
  // 1. Almost no artist overlap → Death (complete transformation)
  // 2. Heavy overlap → Strength (staying the course)
  // 3. New genres appeared → card driven by those new genres
  // 4. Taste shifted but not completely → follow present card
  // 5. Catch-all → Wheel of Fortune
  let futureCard;
  if (stability < 0.2 && arrived.length >= 3) {
    futureCard = 'Death';
  } else if (stability > 0.7) {
    futureCard = 'Strength';
  } else if (newGenres.length > 3) {
    futureCard = topCard(scoreGenres(newGenres)) || 'Wheel of Fortune';
  } else if (presentCard !== pastCard) {
    futureCard = presentCard;
  } else {
    futureCard = 'Wheel of Fortune';
  }

  return {
    pastCard, presentCard, futureCard,
    stability, newGenres,
    longArtist1:  longItems[0]?.name  || 'your longtime artists',
    longArtist2:  longItems[1]?.name  || null,
    shortArtist1: shortItems[0]?.name || longItems[0]?.name || 'your recent artists',
    shortArtist2: shortItems[1]?.name || null,
    departedName: departed[0]?.name   || null,
    arrivedName:  arrived[0]?.name    || null,
  };
}

// ─── PKCE ────────────────────────────────────────────────
function randomString(len) {
  const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
  return Array.from(crypto.getRandomValues(new Uint8Array(len)))
    .map(b => chars[b % chars.length]).join('');
}
async function makeChallenge(verifier) {
  const digest = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(verifier));
  return btoa(String.fromCharCode(...new Uint8Array(digest)))
    .replace(/\+/g,'-').replace(/\//g,'_').replace(/=/g,'');
}
async function login() {
  const verifier  = randomString(64);
  const challenge = await makeChallenge(verifier);
  sessionStorage.setItem('pkce_verifier', verifier);
  window.location.href = 'https://accounts.spotify.com/authorize?' + new URLSearchParams({
    client_id: CLIENT_ID, response_type: 'code', redirect_uri: REDIRECT_URI,
    scope: 'user-top-read', code_challenge_method: 'S256', code_challenge: challenge,
  });
}
async function exchangeToken(code) {
  const res = await fetch('https://accounts.spotify.com/api/token', {
    method: 'POST',
    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
    body: new URLSearchParams({
      client_id: CLIENT_ID, grant_type: 'authorization_code',
      code, redirect_uri: REDIRECT_URI,
      code_verifier: sessionStorage.getItem('pkce_verifier'),
    }),
  });
  return res.json();
}

// ─── SPOTIFY ─────────────────────────────────────────────
async function spotifyGet(path, token) {
  const res = await fetch('https://api.spotify.com/v1' + path, {
    headers: { Authorization: 'Bearer ' + token },
  });
  return res.json();
}
async function fetchMusicData(token) {
  const [longArtists, shortArtists] = await Promise.all([
    spotifyGet('/me/top/artists?limit=20&time_range=long_term',  token),
    spotifyGet('/me/top/artists?limit=20&time_range=short_term', token),
  ]);
  return { longArtists, shortArtists };
}

// ─── RENDER ──────────────────────────────────────────────
const app = document.getElementById('app');

function renderLanding() {
  app.innerHTML = `
    <div class="landing">
      <span class="moon">☽</span>
      <h1>Music Tarot</h1>
      <div class="ornament">
        <div class="ornament-line"></div><span class="ornament-dot">✦</span><div class="ornament-line"></div>
      </div>
      <p>The cards do not lie.<br>Neither does your Spotify history.</p>
      <button class="btn-connect" onclick="login()">Connect Spotify</button>
    </div>`;
}

function renderLoading() {
  app.innerHTML = `
    <div class="loading">
      <span class="spinner">✦</span>
      <p>Consulting the cards&hellip;</p>
    </div>`;
}

function renderReading(n) {
  const cards = [
    { position: 'The Past',    card: n.pastCard,    reading: READINGS[n.pastCard]?.past(n)    || '' },
    { position: 'The Present', card: n.presentCard, reading: READINGS[n.presentCard]?.present(n) || '' },
    { position: 'The Future',  card: n.futureCard,  reading: READINGS[n.futureCard]?.future(n)  || '' },
  ];

  const cardsHtml = cards.map((card, i) => {
    const arc = ARCANA[card.card] || { num: '?', sym: '✦' };
    return `
      <div class="tarot-card" id="card-${i}">
        <div class="card-position">${card.position}</div>
        <div class="card-numeral">${arc.num}</div>
        <span class="card-symbol">${arc.sym}</span>
        <div class="card-name">${card.card}</div>
        <div class="card-rule"></div>
        <p class="card-reading">${card.reading}</p>
      </div>`;
  }).join('');

  app.innerHTML = `
    <div class="reading">
      <div class="reading-header">
        <h2>Your Reading</h2>
        <p>Three cards drawn from the archive of your soul</p>
      </div>
      <div class="cards-grid">${cardsHtml}</div>
    </div>`;

  cards.forEach((_, i) => {
    setTimeout(() => document.getElementById('card-' + i)?.classList.add('revealed'), 200 + i * 450);
  });
}

function renderError(msg) {
  app.innerHTML = `
    <div class="error-state">
      <p>✦ &nbsp; ${msg}</p>
      <button class="restart-btn" onclick="renderLanding()">Try Again</button>
    </div>`;
}

// ─── INIT ────────────────────────────────────────────────
async function init() {
  const params = new URLSearchParams(window.location.search);
  const code   = params.get('code');
  const error  = params.get('error');

  if (error) { renderLanding(); return; }

  if (code) {
    window.history.replaceState({}, '', window.location.pathname);
    renderLoading();
    try {
      const tokenData = await exchangeToken(code);
      if (!tokenData.access_token) throw new Error('Spotify did not return a token — double-check the redirect URI in your Spotify dashboard matches exactly: ' + REDIRECT_URI);
      const musicData = await fetchMusicData(tokenData.access_token);
      if (!musicData.longArtists.items?.length && !musicData.shortArtists.items?.length) {
        throw new Error('No artist data returned from Spotify. Make sure you have some listening history and try again.');
      }
      const narrative = buildNarrative(musicData);
      renderReading(narrative);
    } catch(e) {
      renderError(e.message || 'The stars are misaligned. Please try again.');
    }
    return;
  }

  renderLanding();
}

init();
</script>
